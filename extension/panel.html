<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vetting Notepad</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <!-- Static Topbar Alert / Message Banner with Shake Effect -->
    <div class="top-banner" id="topBanner" style="display:none;" role="alert">
      <span class="top-banner-msg" id="topBannerMsg"></span>
      <button type="button" class="top-banner-btn" id="topBannerBtn" style="display:none;"></button>
      <button type="button" class="top-banner-close" id="topBannerClose" title="Dismiss" aria-label="Dismiss message">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Main Views Container -->
    <div class="views-root">
      <!-- Top Navigation Bar with Creatable Select -->
      <header class="top-nav">
        <div id="typeSelectMount" class="c-select"></div>

        <!-- 1-Click Pencil Icon to Edit Items -->
        <button class="ibtn primary" id="btnEditType" title="Edit items for this vetting type" aria-label="Edit items">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>

        <!-- Notes Icon -->
        <button class="ibtn" id="btnNotes" title="Notes" aria-label="Notes">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </button>

        <!-- Settings Icon -->
        <button class="ibtn" id="btnSettings" title="Settings & Theme" aria-label="Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

    <!-- Main Scrollable Form Area -->
    <div class="scroll-pane" id="mainForm"></div>

    <!-- Compact Footer -->
    <footer class="footer-bar">
      <!-- Collapsible Preview Drawer -->
      <div class="preview-drawer" id="previewDrawer">
        <pre id="previewText" class="empty">Nothing filled yet</pre>
      </div>

      <!-- Material Underline Comment Input with Suggestions -->
      <div class="field-container comment-container">
        <div class="material-field" id="commentFieldBox">
          <label class="mat-label" for="commentInput">Comment (optional)</label>
          <input type="text" class="mat-input" id="commentInput" autocomplete="off" spellcheck="false">
          <div class="mat-underline-continuous"></div>
        </div>
        <ul class="comment-suggestions-menu" id="commentSuggestionsMenu" role="listbox"></ul>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <button class="btn-action btn-eye" id="btnTogglePreview" title="Toggle copy preview" aria-label="Toggle preview">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="btn-action btn-clear" id="btnClear" title="Clear filled items">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          <span id="clearBtnText">Clear</span>
        </button>
        <button class="btn-action btn-copy" id="btnCopy" title="Copy to clipboard (Ctrl+Enter)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span id="copyBtnText">Copy</span>
        </button>
      </div>
    </footer>

    <!-- Sub-view: Settings & Theme Screen -->
    <div class="view-sub" id="settingsView" style="display:none;">
      <div class="view-header">
        <button class="ibtn" id="btnBackSettings" title="Back to main">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="view-title">Settings</span>
      </div>
      <div class="scroll-pane" style="padding:8px 10px;">
        <div class="section-head">Appearance Theme</div>
        <div class="setting-chips" id="themeChips">
          <button class="chip" data-theme-val="auto">Auto (System)</button>
          <button class="chip" data-theme-val="light">Light</button>
          <button class="chip" data-theme-val="dark">Dark</button>
        </div>

        <div class="section-head" style="margin-top:14px;">Auto-Clear Details After Copy</div>
        <p style="font-size:10.5px;color:var(--text-muted);margin-bottom:6px;">Wipes customer data after a countdown. Typing or clicking Cancel in the top banner halts it.</p>
        <div class="setting-chips" id="autoClearChips">
          <button class="chip" data-ac="0">Off (Default)</button>
          <button class="chip" data-ac="5">5s</button>
          <button class="chip" data-ac="10">10s</button>
          <button class="chip" data-ac="15">15s</button>
          <button class="chip" data-ac="30">30s</button>
          <button class="chip" data-ac="60">1m</button>
        </div>

        <div class="section-head" style="margin-top:16px;">Configuration & Data</div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="btn-action" id="btnExportData" style="flex:1;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Data
          </button>
          <button class="btn-action" id="btnImportData" style="flex:1;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import Data
          </button>
          <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">
        </div>

        <button class="btn-action" id="btnResetAll" style="width:100%;color:var(--color-danger);border-color:var(--border-line);">
          Reset Vetting Types to Defaults
        </button>
      </div>
    </div>

      <!-- Sub-view: Edit Vetting Items Screen -->
      <div class="view-sub" id="editView" style="display:none;">
        <div class="view-header">
          <button class="ibtn" id="btnBackEdit" title="Back to main">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span class="view-title">Edit Vetting Items</span>
        </div>
        <div class="scroll-pane" style="padding:8px 10px;" id="editPane"></div>
      </div>

      <!-- Sub-view: Notes Screen -->
      <div class="view-sub" id="notesView" style="display:none;">
        <div class="view-header">
          <button class="ibtn" id="btnBackNotes" title="Back" aria-label="Back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div id="noteSelectMount" class="c-select note-c-select"></div>
          <button class="ibtn primary" id="btnNewNote" title="New Note" aria-label="New Note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="ibtn" id="btnCopyNote" title="Copy Note" aria-label="Copy Note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          </button>
          <button class="ibtn" id="btnDeleteNote" title="Delete Note" aria-label="Delete Note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
        <div class="note-canvas-wrap">
          <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Untitled Note" autocomplete="off" spellcheck="false">
          <textarea class="note-body-textarea" id="noteBodyText" placeholder="Start typing notes..." autocomplete="off" spellcheck="false"></textarea>
          <div class="note-status-bar">
            <span id="noteSaveStatus">Saved</span>
            <span id="noteWordCharCount">0 chars</span>
          </div>
        </div>
      </div>
    </div> <!-- /.views-root -->

    <!-- Call-Wide Floating Key-Value Notepad (Call Companion) -->
    <div class="callpad-overlay" id="callPadOverlay" style="display:none;"></div>
    <div class="callpad-popover" id="callPadPopover" style="display:none;" role="dialog" aria-label="Call Items">
      <div class="callpad-header">
        <div class="callpad-title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
          <span>Call Items</span>
        </div>
        <button type="button" class="callpad-close" id="callPadClose" title="Close" aria-label="Close">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="callpad-body" id="callPadBody"></div>
    </div>

    <!-- Draggable Floating Action Button (FAB) -->
    <button type="button" class="callpad-fab" id="callPadFab" title="Call Items (Current Call)" aria-label="Call Items">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </svg>
    </button>
  </div> <!-- /#app -->

  <script type="module" src="panel.js"></script>
</body>
</html>
